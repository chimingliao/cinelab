<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CINE LAB — CIPP v1.1</title><style>*{box-sizing:border-box}body{margin:0;background:#141617;color:#e5e5e1;font:15px/1.65 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:40px 24px}header{border-bottom:1px solid #393c3c;margin-bottom:28px;padding-bottom:22px}h1{font-size:42px;letter-spacing:.12em;margin:0}small,label{color:#a6aaa8}h2{font-size:15px;letter-spacing:.08em} .layout{display:grid;grid-template-columns:1fr 1fr;gap:28px}.profiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,select{font:inherit;color:inherit;background:#242829;border:1px solid #414747;border-radius:8px;padding:12px;cursor:pointer}button.active{border-color:#b7c9b9;background:#303b35} .profile{text-align:left;padding:0;overflow:hidden}.profile div{padding:12px}.swatch{height:48px;display:flex}.swatch i{flex:1}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}textarea{width:100%;min-height:570px;background:#1b1e1f;border:1px solid #414747;color:#e5e5e1;border-radius:8px;padding:18px;font:14px/1.8 system-ui;resize:vertical}input{accent-color:#a9bfae}footer{color:#999;font-size:12px;margin-top:25px}.primary{background:#c0d0c2;color:#17231b;font-weight:bold} @media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:22px 15px}h1{font-size:32px}}</style><main><header><small>IMAGE POST-PRODUCTION / CIPP v1.1</small><h1>CINE LAB</h1><div id="subtitle">電影影像風格實驗室</div><div class="controls"><label id="uiLabel" for="ui">介面語言</label><select id="ui"><option value="0">繁體中文</option><option value="1">English</option><option value="2">日本語</option></select></div></header><div class="layout"><section><h2>01 / 電影風格 CINEMATIC PROFILE</h2><div class="profiles" id="profiles"></div><h2>02 / 處理強度 INTENSITY</h2><div class="controls" id="levels"></div><h2>03 / 原圖保護 SOURCE PROTECTION</h2><div id="locks"></div><footer>色票為風格示意，並非實際照片調色預覽。</footer></section><section><h2>04 / 提示詞 PROMPT OUTPUT</h2><div class="controls"><label id="promptLabel" for="lang">提示詞語言</label><select id="lang"><option value="0">繁體中文</option><option value="1">English</option><option value="2">日本語</option></select><button class="primary" id="copy">複製提示詞</button><button id="save">儲存 TXT</button></div><textarea id="out" readonly></textarea><small id="status" aria-live="polite"></small></section></div><footer>CORE + PROFILE + INTENSITY + PROTECTION · 本機離線運作，不上傳照片。生成式模型無法保證像素級一致性。</footer></main><script>
const profiles=[
['Emerald Noir','翡翠暗調',['#102b25','#31554b','#78988b','#c18a4d'],'深翡翠綠、墨綠與灰青綠環境色，低飽和綠黑陰影，琥珀與鎢絲暖光（僅限既有暖光）。低調曝光、深邃黑位、柔潤中間調與克制光暈；靜謐、孤獨、懷舊。避免青橙撞色及黃褐污染。','Deep emerald and muted jade environment, desaturated green-black shadows, amber tungsten tones only in existing warm lights. Low-key exposure, deep blacks, smooth midtones and restrained halation. Quiet, solitary, nostalgic; avoid forced teal-orange and muddy yellow.'],
['Japanese Airy','日系通透',['#a5b8b4','#d4ded7','#e9e5d8','#b4c7d4'],'自然日光、清透中高調、柔和陰影、低飽和粉彩與中性白。保留空氣感及自然膚色，高光柔和但不過曝；日常生活電影氛圍。','Natural daylight, airy mid-to-high key exposure, soft shadows, muted pastels and neutral whites. Preserve natural skin and atmospheric clarity; gentle highlights without clipping. Slice-of-life cinema.'],
['Warm Nostalgia','暖色懷舊',['#59483d','#a58060','#c8ac86','#e4d5b7'],'柔和暖中間調、蜂蜜與淡琥珀高光、自然中性陰影，適度降低飽和度。保留原始白平衡邏輯，避免全局泛黃、褐色濾鏡及刻意做舊。','Soft warm midtones, honey and pale amber highlights, natural neutral shadows and moderate desaturation. Respect source white balance; avoid global yellow cast, sepia and artificial aging.'],
['Nordic Neutral','北歐冷靜',['#353e45','#78858b','#b5bcb9','#e1e4e0'],'冷中性灰、低飽和藍灰與自然材質色。柔和漫射光、清晰空間層次、克制對比；保留白色純淨與自然膚色，避免冰冷青藍污染。','Cool neutral grays, muted blue-gray and authentic material colors. Soft diffuse light, clear depth and restrained contrast. Preserve clean whites and natural skin; avoid icy cyan contamination.'],
['Monochrome','黑白紀實',['#151515','#555555','#aaaaaa','#eeeeee'],'轉為純中性黑白，以亮度分離人物與環境，深黑、細膩灰階與柔和高光。保留皮膚與材質細節，不強制加入顆粒，不使用褐色染色。','Convert to neutral monochrome, separating subjects through luminance. Deep blacks, nuanced grays and soft highlights. Preserve skin and material detail; no forced grain or sepia tint.'],
['Natural Cinema','自然電影',['#38443d','#888b78','#b4a48e','#dedbd1'],'依原始場景自適應調色，維持自然色相與白平衡，優化曝光、色彩分離、局部對比及高光滾降。不強制冷暖風格或低調曝光，保留原始情緒。','Adaptive grading based on the source scene. Preserve natural hues and white balance; refine exposure, color separation, local contrast and highlight roll-off. No forced palette or low-key exposure; retain original mood.']];
const locks=[['人物身份與身體比例','保留人物數量、身份、五官、髮型、表情、姿勢、身體比例與服裝。','Preserve subject count, identity, facial features, hair, expression, pose, proportions and clothing.'],['自然膚色與皮膚質感','避免膚色污染、過度磨皮及塑膠皮膚；黑白模式保留自然皮膚亮度與質感。','Prevent skin color contamination, excessive smoothing and plastic skin; preserve natural skin luminance and texture in monochrome.'],['構圖與場景','鎖定構圖、裁切、透視、物體位置及場景布局。','Lock composition, crop, perspective, object positions and scene layout.'],['既有光源','保留既有光源方向與位置，不新增光源。','Preserve existing light direction and position; add no light sources.']];
let p=0,l=1;const $=id=>document.getElementById(id);profiles.forEach((v,i)=>{let b=document.createElement('button');b.className='profile';b.innerHTML='<span class="swatch">'+v[2].map(c=>`<i style="background:${c}"></i>`).join('')+'</span><div><small>P0'+(i+1)+'</small><br><b>'+v[0]+'</b><br>'+v[1]+'</div>';b.onclick=()=>{p=i;update()};$('profiles').append(b)});['輕度','標準','強烈'].forEach((v,i)=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{l=i;update()};$('levels').append(b)});locks.forEach((v,i)=>{let d=document.createElement('div');d.innerHTML=`<label><input type="checkbox" checked id="lock${i}"> ${v[0]}</label>`;$('locks').append(d);d.querySelector('input').onchange=update});$('lang').onchange=update;
function oldUpdate(){let e=+$('lang').value;[...$('profiles').children].forEach((b,i)=>{b.classList.toggle('active',i===p);b.setAttribute('aria-pressed',i===p)});[...$('levels').children].forEach((b,i)=>{b.classList.toggle('active',i===l);b.setAttribute('aria-pressed',i===l)});let a=e?['CIPP v1.1 — '+profiles[p][0],'CORE\nPerform non-destructive cinematic post-processing on the source image. Adjust grading, tonal response and optical rendering only; do not invent new content. Preserve authentic detail. Soften light, not the subject. Use restrained bloom, halation and diffusion only where justified by existing highlights.','PROTECTION\n'+locks.filter((v,i)=>$('lock'+i).checked).map(v=>v[2]).join('\n'),'PROFILE\n'+profiles[p][4],'INTENSITY\n'+['Subtle refinement, close to source.','Balanced cinematic treatment.','Pronounced stylistic grading without clipping or loss of detail.'][l],'NEGATIVE\nHDR, excessive sharpening, artificial aging, added grain, banding, muddy haze, excessive bloom, global blur, invented content.']:['CIPP v1.1｜'+profiles[p][1],'【通用核心】\n基於原始照片進行非破壞式電影級後期處理，僅調整色彩分級、曝光階調及光學表現，不憑空新增內容。保留真實細節，柔化光線而非模糊主體。依既有高光適度使用 Bloom、Halation 與 Soft Diffusion。','【原圖保護】\n'+locks.filter((v,i)=>$('lock'+i).checked).map(v=>v[1]).join('\n'),'【電影風格】\n'+profiles[p][3],'【處理強度】\n'+['輕度修飾，最大程度貼近原圖。','均衡呈現電影美學。','強化風格辨識度，但避免曝光截斷與細節流失。'][l],'【負面提示詞】\nHDR、過度銳化、刻意做舊、額外顆粒、色彩斷層、混濁灰霧、過度泛光、全局模糊、憑空新增內容。'];$('out').value=a.join('\n\n');$('status').textContent='';} $('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('out').value);$('status').textContent='已複製提示詞'}catch{$('out').select();$('status').textContent=document.execCommand('copy')?'已複製提示詞':'請按 Ctrl+C 或 Cmd+C 複製'}};$('save').onclick=()=>{let u=URL.createObjectURL(new Blob([$('out').value],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='CIPP-P0'+(p+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
const jpNames=['翡翠ノワール','透明感シネマ','暖色ノスタルジア','北欧ニュートラル','モノクロ・ドキュメンタリー','ナチュラルシネマ'];
const jpProfiles=[
'深いエメラルドグリーン、墨緑、灰青緑を環境色とし、彩度を抑えた緑黒のシャドウと、既存の暖色光に限り琥珀色やタングステン光を表現する。ローキー露出、深い黒、滑らかな中間調、控えめなハレーション。静寂、孤独、郷愁を演出し、過度な青橙対比や黄褐色の濁りを避ける。',
'自然光を活かした明るく透明感のある中高輝度、柔らかな影、低彩度のパステルカラーとニュートラルな白。自然な肌色と空気感を保ち、白飛びのない柔らかなハイライトで日常映画の雰囲気を表現する。',
'柔らかな暖色の中間調、蜂蜜色と淡い琥珀色のハイライト、自然で中立的な影。彩度を適度に抑え、元のホワイトバランスの関係を尊重する。全体の黄ばみ、セピア調、人工的な経年加工を避ける。',
'冷たすぎないニュートラルグレー、低彩度のブルーグレー、自然な素材色。柔らかな拡散光、明瞭な奥行き、控えめなコントラスト。白の純度と自然な肌色を保ち、過度な青緑の色かぶりを避ける。',
'純粋なニュートラルモノクロに変換し、輝度差で人物と背景を分離する。深い黒、繊細なグレー階調、柔らかなハイライト。肌と素材の質感を保ち、粒子の強制追加やセピア着色を行わない。',
'元のシーンに応じて柔軟にカラーグレーディングを行う。自然な色相とホワイトバランスを維持し、露出、色分離、局所コントラスト、ハイライトのロールオフを最適化する。固定色調やローキー露出を強制せず、元の情緒を保つ。'];
const jpLocks=['人物の人数、同一性、顔立ち、髪型、表情、姿勢、身体比率、衣装を維持する。','肌の色かぶり、過度な美肌加工、プラスチックのような肌を避ける。モノクロでは自然な肌の輝度と質感を維持する。','構図、トリミング、遠近法、物体の位置、シーンの配置を維持する。','既存光源の方向と位置を維持し、新たな光源を追加しない。'];
const uiText=[['電影影像風格實驗室','介面語言','提示詞語言','電影風格','處理強度','原圖保護','提示詞','複製提示詞','儲存 TXT','色票為風格示意，並非實際照片調色預覽。','本機離線運作，不上傳照片。生成式模型無法保證像素級一致性。',['輕度','標準','強烈'],locks.map(v=>v[0]),'已複製提示詞','請按 Ctrl+C 或 Cmd+C 複製'],['Cinematic Image Style Lab','Interface language','Prompt language','Cinematic profile','Intensity','Source protection','Prompt output','Copy prompt','Save TXT','Swatches illustrate the style, not actual photo grading.','Runs offline. No photo uploads. Generative models cannot guarantee pixel-level consistency.',['Subtle','Standard','Strong'],['Identity and proportions','Natural skin and texture','Composition and scene','Existing light sources'],'Prompt copied','Press Ctrl+C or Cmd+C to copy'],['映画映像スタイル研究室','表示言語','プロンプト言語','映画スタイル','処理強度','元画像の保護','プロンプト出力','コピー','TXT保存','色見本はスタイルのイメージであり、実際の写真の補正結果ではありません。','オフライン動作。写真のアップロード不要。生成AIは画素単位の一致を保証できません。',['弱','標準','強'],['人物の同一性と体型','自然な肌色と質感','構図とシーン','既存光源'],'コピーしました','Ctrl+C または Cmd+C でコピーしてください']];
function update(){const u=+$('ui').value,e=+$('lang').value,t=uiText[u];document.documentElement.lang=['zh-Hant','en','ja'][u];['subtitle','uiLabel','promptLabel'].forEach((id,i)=>$(id).textContent=t[i]);document.querySelectorAll('h2').forEach((h,i)=>h.textContent='0'+(i+1)+' / '+t[i+3]);$('copy').textContent=t[7];$('save').textContent=t[8];document.querySelectorAll('footer')[0].textContent=t[9];document.querySelectorAll('footer')[1].textContent='CORE + PROFILE + INTENSITY + PROTECTION · '+t[10];[...$('profiles').children].forEach((b,i)=>{b.querySelector('div').innerHTML='<small>P0'+(i+1)+'</small><br><b>'+profiles[i][0]+'</b>'+(u===1?'':'<br>'+(u===2?jpNames[i]:profiles[i][1]));});[...$('levels').children].forEach((b,i)=>b.textContent=t[11][i]);[...$('locks').children].forEach((d,i)=>{d.querySelector('label').lastChild.textContent=' '+t[12][i]});oldUpdate();if(e===2){$('out').value=['CIPP v1.1｜'+jpNames[p],'【共通コア】\n元画像に対して非破壊的な映画品質のポストプロダクションを行う。カラーグレーディング、露出階調、光学表現のみを調整し、新しい内容を作り出さない。リアルな細部を維持し、被写体ではなく光を柔らかくする。既存のハイライトに応じてブルーム、ハレーション、ソフトディフュージョンを控えめに適用する。','【元画像の保護】\n'+jpLocks.filter((v,i)=>$('lock'+i).checked).join('\n'),'【映画スタイル】\n'+jpProfiles[p],'【処理強度】\n'+['元画像に近い控えめな補正。','バランスの取れた映画的表現。','スタイルを強調しつつ、白飛び・黒つぶれや細部の損失を避ける。'][l],'【ネガティブプロンプト】\nHDR、過度なシャープネス、人工的な経年加工、追加の粒子、階調飛び、濁った霞、過剰なブルーム、全体のぼかし、新規要素の追加。'].join('\n\n').replace('真实','リアル');}}
$('ui').onchange=update;$('copy').onclick=async()=>{const t=uiText[+$('ui').value];try{await navigator.clipboard.writeText($('out').value);$('status').textContent=t[13]}catch{$('out').select();$('status').textContent=document.execCommand('copy')?t[13]:t[14]}};$('save').onclick=()=>{let u=URL.createObjectURL(new Blob([$('out').value],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='CIPP-P0'+(p+1)+'-'+['zh-Hant','en','ja'][+$('lang').value]+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};update();</script></html>
